name: Build and Release PDF

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.x'  # Define .NET version
  PROJECT_NAME: 'Flixen.CurriculumVitae.Builder'  # Define project name
  THEME_FILE: './theme.yaml' # theme file (colors, fonts, image)
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - output: resume.pdf
            config: ../profile.yaml
          - output: resume-anonymous.pdf
            config: ../profile.yaml
            flags: --anonymous
          - output: resume-golang.pdf
            config: ../profile-golang.yaml

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Setup .NET Core with the specified version
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Restore dependencies with Release configuration
      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: >-
          dotnet build
          --no-restore
          --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Generate ${{ matrix.output }}
        working-directory: ./${{ env.PROJECT_NAME }}
        run: >-
          dotnet run
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --config-file ${{ matrix.config }}
          --theme-file ${{ env.THEME_FILE }}
          ${{ matrix.flags }}
          -- write
          --output ../github-release/folder/${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: ./github-release/folder/${{ matrix.output }}

  # Single job so parallel matrix runs don't race to create the release
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pdfs
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: pdfs/*.pdf
          token: ${{ secrets.GITHUB_TOKEN }}
