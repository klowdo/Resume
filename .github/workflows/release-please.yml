name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_VERSION: '10.x'
  PROJECT_NAME: 'Flixen.CurriculumVitae.Builder'
  BUILD_CONFIGURATION: Release
  THEME_FILE: './theme.yaml'

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-pdf:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - output: resume.pdf
            config: ../profile.yaml
          - output: resume-anonymous.pdf
            config: ../profile.yaml
            flags: --anonymous
          - output: resume-golang.pdf
            config: ../profile-golang.yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: >-
          dotnet build
          --no-restore
          --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Generate ${{ matrix.output }}
        working-directory: ./${{ env.PROJECT_NAME }}
        run: >-
          dotnet run
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --config-file ${{ matrix.config }}
          --theme-file ${{ env.THEME_FILE }}
          ${{ matrix.flags }}
          -- write
          --output ../github-release/folder/${{ matrix.output }}

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ./github-release/folder/${{ matrix.output }}
          token: ${{ secrets.GITHUB_TOKEN }}
